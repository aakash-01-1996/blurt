[tool.uv.workspace]
members = ["core", "backend/api", "backend/worker", "evals"]

[tool.uv.sources]
blurt_core = { workspace = true }

[tool.uv]
dev-dependencies = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.2",
    "boto3-stubs[s3]>=1.37",
    "types-python-jose>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["evals/", ".*/tests/"]

[[tool.mypy.overrides]]
module = "mlx_whisper"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "backend/api/tests", "backend/worker/tests"]
