apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-worker
  namespace: blurt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-worker
  template:
    metadata:
      labels:
        app: audio-worker
        app.kubernetes.io/part-of: blurt
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: blurt-worker:dev
          envFrom:
            - configMapRef:
                name: blurt-config
            - secretRef:
                name: blurt-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HANDLED_KINDS
              value: "normalize,transcribe"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
