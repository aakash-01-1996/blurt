[project]
name = "blurt_core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.15",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "boto3>=1.37",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurt_core"]
