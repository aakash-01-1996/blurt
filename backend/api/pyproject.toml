[project]
name = "blurt_api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "blurt_core",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.0",
    "bcrypt>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurt_api"]
