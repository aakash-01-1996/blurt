apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: blurt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: blurt
    spec:
      containers:
        - name: api
          image: blurt-api:dev
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: blurt-config
            - secretRef:
                name: blurt-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
