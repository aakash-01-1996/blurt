apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: blurt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/part-of: blurt
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: blurt-worker:dev
          envFrom:
            - configMapRef:
                name: blurt-config
            - secretRef:
                name: blurt-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
