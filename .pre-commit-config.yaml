repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^(core|backend)/
        exclude: /tests/
        additional_dependencies:
          - pydantic>=2.11
          - pydantic-settings>=2.8
          - sqlalchemy>=2.0
          - fastapi>=0.115
          - boto3>=1.37
          - boto3-stubs[s3]>=1.37
