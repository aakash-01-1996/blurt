name: Weekly Eval

# Runs the routing + extraction evals against the live LLM once a week.
# Catches model drift / provider decommissioning before it hits the pipeline.
on:
  schedule:
    - cron: "0 8 * * 6" # Saturdays 08:00 UTC
  workflow_dispatch: # allow a manual run anytime

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Run evals
        env:
          LLM_BASE_URL: "https://api.groq.com/openai/v1"
          LLM_MODEL: "openai/gpt-oss-20b"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -o pipefail
          make eval | tee eval-out.txt
      - name: Weekly summary
        if: always()
        run: |
          {
            echo "## Weekly eval — $(date -u +%F)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Gates passed."
            else
              echo "❌ Gates failed — a prompt or the LLM model needs a look."
            fi
            echo '```'
            cat eval-out.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
