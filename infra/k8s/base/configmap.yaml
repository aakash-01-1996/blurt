apiVersion: v1
kind: ConfigMap
metadata:
  name: blurt-config
  namespace: blurt
data:
  DATABASE_URL: "postgresql+psycopg://blurt:blurt@postgres:5432/blurt"
  STORAGE_BACKEND: "s3"
  AUDIO_DIR: "/data/audio"
  STT_PROVIDER: "groq"
  STT_MODEL: "whisper-large-v3-turbo"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "openai/gpt-oss-20b"
  ROUTER_CONFIDENCE_THRESHOLD: "0.7"
  WORKER_CONCURRENCY: "1"
  API_INTERNAL_URL: "http://api:8000"
  AUDIO_RETENTION_DAYS: "14"
  MAX_UPLOAD_MB: "25"
  S3_BUCKET: "blurt-audio-dev"
  # WebAuthn / passkeys — set these to the real deployed domain before use.
  # RP_ID is the registrable domain (no scheme/port); ORIGIN is the full URL the browser sees.
  WEBAUTHN_RP_ID: "blurt.example.com"
  WEBAUTHN_RP_NAME: "Blurt"
  WEBAUTHN_ORIGIN: "https://blurt.example.com"
